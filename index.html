<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>RFC-DoC-Atlas</title>
  <link rel="icon" type=image/ico href="icon.ico">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />

  <style>

  </style>
</head>

<body>

<button id="burger">☰</button>

<div id="top-right-controls">
  <button id="about-toggle" type="button">About</button>
  <span id="header-meta"></span>
</div>

<button id="deselect-all">clear map</button>

<div id="legend" class ="hidden" >
  <div class="legend-item">
    <span class="legend-color CORE"></span>
    <span>CORE</span>
  </div>

  <div class="legend-item">
    <span class="legend-color HISTORICAL"></span>
    <span>HISTORICAL</span>
  </div>

  <div class="legend-item">
    <span class="legend-color PERIPHERY"></span>
    <span>PERIPHERY</span>
  </div>

  <div class="legend-item">
    <span class="legend-color MINORITY"></span>
    <span>MINORITY</span>
  </div>
</div>






<div id="about-page" aria-hidden="true">
  <div class="about-box-header">
    <h3 id="about-title">About</h3>
    <button id="about-close" type="button" aria-label="Close about box">×</button>
  </div>
  <div id="about-content"></div>
</div>


<div id="tooltip-box"></div>


<div id="sidebar" class="hidden">
  <h3 id="sidebar-header">Layers</h3>
  <div class="options-container"></div>
</div>

<div id="map"></div>






<script data-goatcounter="https://kaffeetoaster.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module" src="js/script.js"></script>



</body>
</html>
