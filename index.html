<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RFC-DoC-Atlas</title>
  <link rel="icon" type=image/ico href="icon.ico">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />

  <style>

  </style>
</head>

<body>

<button id="burger">☰</button>

<div id="about-header">
  <span id="header-meta"></span>
</div>

<button id="deselect-all">clear<br>map</button>

<div id="legend" class ="hidden" >
  <div class="legend-item">
    <span class="legend-color CORE"></span>
    <span>CORE</span>
  </div>

  <div class="legend-item">
    <span class="legend-color HISTORICAL"></span>
    <span>HISTORICAL</span>
  </div>

  <div class="legend-item">
    <span class="legend-color PERIPHERY"></span>
    <span>PERIPHERY</span>
  </div>

  <div class="legend-item">
    <span class="legend-color MINORITY"></span>
    <span>MINORITY</span>
  </div>
</div>

<div id="bonus-filter" class="hidden">
  <button id="bonus-filter-toggle" type="button" title="Filter bonuses" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M3 4h18l-7 8.5V19l-4 2v-8.5z"/>
    </svg>
  </button>
  <div id="bonus-filter-panel" class="hidden">
    <h3 id="bonus-filter-header">Resource filter</h3>
    <input type="search" id="bonus-filter-search" placeholder="Search...">
    <div id="bonus-filter-selected"></div>
    <div id="bonus-filter-list"></div>
  </div>
</div>


<div id="year-filter" class="hidden">
  <input type="number" id="year-start" aria-label="Start year">
  <div id="year-slider">
    <div id="year-slider-inner">
      <div id="year-track"><div id="year-fill"></div></div>
      <input type="range" id="year-range-start" aria-label="Start year" step="1">
      <input type="range" id="year-range-end" aria-label="End year" step="1">
    </div>
  </div>
  <input type="number" id="year-end" aria-label="End year">
</div>

<div id="city-planner-container">
  <button id="city-planner-toggle" type="button">city<br>planner</button>
  <button id="city-planner-clear" type="button">clear<br>plan</button>
  <button id="city-planner-show" type="button">hide<br>plan</button>
  <div id = "color-container"></div>
</div>




<div id="tooltip-box"></div>


<div id="sidebar" class="hidden">
  <h3 id="sidebar-header">Layers and Markers</h3>
  <input type="search" id="options-search" placeholder="Search...">
  <div class="options-container"></div>
</div>

<div id="map"></div>






<script data-goatcounter="https://kaffeetoaster.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script type="module" src="js/script.js"></script>



</body>
</html>
